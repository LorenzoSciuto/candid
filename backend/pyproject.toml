[project]
name = "wennovate-candid"
version = "1.0.0"
description = "Candid by Wennovate — AI-powered recruiting assistant (backend API)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wennovate" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlmodel>=0.0.38",
    "psycopg2-binary>=2.9.12",
    "python-multipart>=0.0.27",
    "cryptography>=48.0.0",
    "openai>=2.36.0",
    "anthropic>=0.105.2",
    "pymupdf>=1.27.2",
    "python-docx>=1.2.0",
    "pydantic-settings>=2.14.0",
    "google-genai>=2.0.0",
    "groq>=1.2.0",
    "httpx>=0.28.1",
    "pyjwt>=2.12.1",
    "alembic>=1.18.4",
]

[project.urls]
Repository = "https://github.com/LorenzoSciuto/candid"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candid"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear and bandit (security) rules.
select = ["E", "F", "I", "B", "S"]
ignore = [
    "E501",   # long lines: prompt templates and HTML are clearer unwrapped
    "B008",   # FastAPI's Depends()/File() in argument defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
