[project]
name = "candid"
version = "0.1.0"
description = "AI-powered recruiting assistant — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlmodel>=0.0.38",
    "psycopg2-binary>=2.9.12",
    "python-multipart>=0.0.27",
    "cryptography>=48.0.0",
    "openai>=2.36.0",
    "anthropic>=0.105.2",
    "pymupdf>=1.27.2",
    "python-docx>=1.2.0",
    "pydantic-settings>=2.14.0",
    "google-genai>=2.0.0",
    "groq>=1.2.0",
    "httpx>=0.28.1",
    "pyjwt>=2.12.1",
    "alembic>=1.18.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candid"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
