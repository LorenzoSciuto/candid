[project]
name = "candid"
version = "0.1.0"
description = "AI-powered recruiting assistant — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlmodel>=0.0.21",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
    "cryptography>=43.0.3",
    "openai>=1.51.0",
    "anthropic>=0.36.0",
    "pymupdf>=1.24.11",
    "python-docx>=1.1.2",
    "pydantic-settings>=2.5.0",
    "google-generativeai>=0.8.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candid"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
